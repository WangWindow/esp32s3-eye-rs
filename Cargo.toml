[workspace]
resolver = "3"
members = [
    "crates/esp32s3-eye-app",
    "crates/esp32s3-eye-board",
    "crates/sd-card",
    "crates/st7789",
    "crates/esp32s3-lcd-cam",
    "crates/ov2640",
]
default-members = ["crates/esp32s3-eye-app"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Core esp-hal stack. Keep versions pinned here so every workspace member
# compiles against exactly the same HAL.
esp-hal = { version = "=1.2.2", features = [
    "esp32s3",
    "unstable",
    "rt",
    "critical-section",
] }
esp-rtos = { version = "=0.4.0", features = ["esp32s3", "embassy"] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32s3"] }
esp-println = { version = "=0.18.0", default-features = false, features = [
    "esp32s3",
    "jtag-serial",
] }
esp-backtrace = { version = "=0.20.0", features = [
    "esp32s3",
    "println",
    "panic-handler",
] }

embassy-executor = "0.10.0"
embassy-time = "0.5.0"

# ESP32-S3-EYE on-board hardware and board-level configuration.
esp32s3-eye-board = { path = "crates/esp32s3-eye-board" }

# Local workspace libraries.
ov2640 = { path = "crates/ov2640" }
esp32s3-lcd-cam = { path = "crates/esp32s3-lcd-cam" }
st7789 = { path = "crates/st7789" }
sd-card = { path = "crates/sd-card" }

# SDMMC card protocol + block-device trait (read/write self-test only).
sdio = "0.5.3"
block-device-driver = "0.2.0"
aligned = "0.4.3"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"

static_cell = "2.1.1"

[profile.dev]
# Debug builds are far too slow/large for a 240 MHz microcontroller.
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
