[package]
name = "esp32s3-eye"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "ESP32-S3-EYE camera/LCD demo in Rust with esp-hal + Embassy"
license = "MIT OR Apache-2.0"

[lib]
name = "esp32s3_eye"
path = "src/lib.rs"

[[bin]]
name = "esp32s3-eye"
path = "src/bin/main.rs"

[dependencies]
# esp-hal 1.1 is the version expected by esp32s3-cam-async 0.1 and esp-rtos 0.3.
esp-hal = { version = "=1.1.2", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "=0.3.0", features = ["esp32s3", "embassy"] }
esp-bootloader-esp-idf = { version = "=0.5.0", features = ["esp32s3"] }
esp-println = { version = "=0.17.0", default-features = false, features = ["esp32s3", "jtag-serial"] }
esp-backtrace = { version = "=0.19.0", features = ["esp32s3", "println", "panic-handler"] }

embassy-executor = "0.10.0"
embassy-time = "0.5.0"

# Async OV2640 setup + DVP/LCD_CAM capture state machine.
esp32s3-cam-async = { version = "0.1.0", default-features = false, features = ["ov2640"] }

critical-section = "1.2.0"
static_cell = "2.1.1"

[profile.dev]
# Debug builds are far too slow/large for a 240 MHz microcontroller.
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
